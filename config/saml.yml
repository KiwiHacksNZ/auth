development:
  service_providers:
    - slug: samltool
      allow_idp_initiated: true
      friendly_name: samltool.io
      tagline: echoes & validates the SAML response. not super useful unless you're hacking on the SAML assertion code...
      entity_id: https://samltool.io
      assertion_consumer_services:
        - location: https://samltool.io
          binding: urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST
    - slug: iam_showcase
      allow_idp_initiated: true
      friendly_name: IAM Showcase
      tagline: Identity management testing
      entity_id: IAMShowcase
      assertion_consumer_services:
        - location: https://sptest.iamshowcase.com/acs
          binding: urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST
      attribute_consuming_services:
        - name: IAM showcase test profile
          requested_attributes:
            - name: email
              friendly_name: Email Address
              is_required: true
            - name: firstName
              friendly_name: Given Name
              is_required: false
            - name: lastName
              friendly_name: Surname
              is_required: false
      allow_unsigned_requests: true

  idp_metadata:
    # Entity IDs are opaque identifiers, not fetched URLs, so each environment
    # gets its own to keep a dev IdP from ever being mistaken for production.
    entity_id: https://account-dev.kiwihacks.com
    single_sign_on_services:
      - location: http://localhost:3000/saml/auth
        binding: urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST
shared:
  idp_metadata:
    organization:
      name: KiwiHacks
      display_name: KiwiHacks Account
      url: https://kiwihacks.org
    contacts:
      - type: technical
        company: KiwiHacks
        given_name: KiwiHacks
        surname: Team
        email_addresses: [niko@kiwihacks.org]
      - type: support
        company: KiwiHacks
        given_name: KiwiHacks
        surname: Team
        email_addresses: [niko@kiwihacks.org]
staging:
  idp_metadata:
    entity_id: https://account-staging.kiwihacks.com
    single_sign_on_services:
      - location: https://account-staging.kiwihacks.com/saml/auth
        binding: urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST
  service_providers:
    - slug: samltool
      allow_idp_initiated: true
      friendly_name: samltool.io
      tagline: check your assertions!
      entity_id: https://samltool.io
      assertion_consumer_services:
        - location: https://samltool.io
          binding: urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST
uat:
  idp_metadata:
    entity_id: https://account-uat.kiwihacks.com
production:
  idp_metadata:
    entity_id: https://account.kiwihacks.com
    single_sign_on_services:
      - location: https://account.kiwihacks.com/saml/auth
        binding: urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST
