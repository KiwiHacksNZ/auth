# Deployed via Portainer (Repository method). All secrets live on the host under
# /opt/kiwihacks-auth and are bind-mounted in: env_file cannot be used here because
# Portainer's compose runs inside the Portainer container and resolves env_file
# against its own filesystem, while volume mounts are resolved by the daemon on
# the host.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: kiwihacks
      POSTGRES_DB: kiwihacks_auth_production
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    volumes:
      - pg-data:/var/lib/postgresql/data
      - /opt/kiwihacks-auth/pg_password:/run/secrets/pg_password:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiwihacks -d kiwihacks_auth_production"]
      interval: 30s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - /opt/kiwihacks-auth/stack.env:/run/secrets/stack.env:ro
      - /opt/kiwihacks-auth/saml:/rails/saml:ro
      - /opt/kiwihacks-auth/oidc_signing_key.pem:/run/secrets/oidc_key:ro
    # stack.env is exported line-by-line rather than sourced so values never pass
    # through shell word-splitting; OIDC_SIGNING_KEY is a multi-line PEM that no
    # env-file format can carry, so it is read from its own mounted file.
    entrypoint:
      - /bin/bash
      - -c
      - 'while IFS= read -r l; do [ -n "$$l" ] && export "$$l"; done < /run/secrets/stack.env; export OIDC_SIGNING_KEY="$$(cat /run/secrets/oidc_key)"; exec /rails/bin/docker-entrypoint "$$@"'
      - --
    command: ["./bin/thrust", "./bin/rails", "server"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    volumes:
      - /opt/kiwihacks-auth/stack.env:/run/secrets/stack.env:ro
      - /opt/kiwihacks-auth/saml:/rails/saml:ro
      - /opt/kiwihacks-auth/oidc_signing_key.pem:/run/secrets/oidc_key:ro
    entrypoint:
      - /bin/bash
      - -c
      - 'while IFS= read -r l; do [ -n "$$l" ] && export "$$l"; done < /run/secrets/stack.env; export OIDC_SIGNING_KEY="$$(cat /run/secrets/oidc_key)"; exec "$$@"'
      - --
    command: ["bundle", "exec", "good_job", "start", "--max-threads=14"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg-data:
